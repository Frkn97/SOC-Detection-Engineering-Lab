title: Active Directory and Domain Reconnaissance Commands
id: 7c2e5541-11a9-4672-b2d9-10871016recon
status: experimental
description: Detects the execution of built-in Windows command-line binaries utilized by adversaries to discover domain accounts, domain trusts, and network topology.
references:
    - https://attack.mitre.org/techniques/T1087/002/
    - https://attack.mitre.org/techniques/T1016/
author: Ahmet Furkan Hüsmek
date: 2026-10-20
modified: 2026-11-07
tags:
    - attack.discovery
    - attack.t1087.002
    - attack.t1016
logsource:
    category: process_creation
    product: windows
detection:
    selection_images:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
            - '\nltest.exe'
            - '\dsquery.exe'
            - '\whoami.exe'
            - '\klist.exe'
    selection_commands:
        CommandLine|contains:
            - 'group "domain admins" /domain'
            - 'user /domain'
            - '/dclist'
            - '/domain_trusts'
            - 'group "Enterprise Admins" /domain'
            - 'whoami /groups'
            - 'whoami /priv'
    condition: selection_images and selection_commands
falsepositives:
    - System administrators running routine inventory or troubleshooting scripts.
level: medium
